<script>
'use strict';
const DATA=JSON.parse(document.getElementById('dataset').textContent);
const CollectionConfig = (() => {
// Shared validation for browser-local website registration and task plans.
// This module never performs network requests or enables a connector.
const STORAGE_KEY = 'mujian.collection-config.v1';
const FIELDS = ['canonical_code', 'title', 'release_date', 'studio_name', 'performer_aliases'];
const JOB_TYPES = ['source_probe', 'work_incremental', 'performer_incremental', 'work_detail', 'reconcile_source'];

function textField(value, label, limit, optional = false) {
  if (typeof value !== 'string') throw new Error(`${label}格式无效`);
  const result = value.trim();
  if ((!optional && !result) || result.length > limit || /[\u0000-\u001f\u007f]/u.test(result)) {
    throw new Error(`${label}${optional ? '最多' : '需填写 1–'}${limit} 个字符`);
  }
  return result;
}

function regionField(region) {
  if (!['japan', 'beijing'].includes(region)) throw new Error('请选择日本或北京执行区域');
  return region;
}

function normalizeWebsite(raw) {
  const value = textField(raw, '网站地址', 500);
  let url;
  try { url = new URL(/^[a-z][a-z0-9+.-]*:/i.test(value) ? value : `https://${value}`); }
  catch { throw new Error('请输入有效的网站域名，例如 https://catalog.example.com'); }
  if (!['http:', 'https:'].includes(url.protocol) || url.username || url.password) {
    throw new Error('网站地址仅支持 HTTP/HTTPS，不能包含账号或密码');
  }
  const domain = url.hostname.toLowerCase().replace(/\.$/, '');
  const labels = domain.split('.');
  if (domain.length > 253 || labels.length < 2 || !/[a-z]/i.test(labels.at(-1)) ||
      labels.some(label => !/^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/i.test(label)) ||
      /(?:^|\.)(?:localhost|local|internal|lan)$/.test(domain)) {
    throw new Error('请填写公开网站的域名，不能使用 IP 或本机地址');
  }
  if (url.port || url.pathname !== '/' || url.search || url.hash || /[\s\\]/u.test(value)) {
    throw new Error('网站地址只填写域名；目录路径在任务中设置，不填写端口、查询参数或片段');
  }
  return { domain, base_url: `${url.protocol}//${domain}/` };
}

function createWebsite(input, existingSources) {
  const { domain, base_url } = normalizeWebsite(input.url);
  const name = textField(input.name, '网站名称', 60);
  if (existingSources.some(source => source.domain?.toLowerCase() === domain)) throw new Error('该域名已登记，请直接为它创建任务');
  if (existingSources.some(source => source.name.toLowerCase() === name.toLowerCase())) throw new Error('网站名称已存在，请使用可区分的名称');
  if (!Array.isArray(input.fields) || !input.fields.length || input.fields.some(field => !FIELDS.includes(field))) {
    throw new Error('请至少选择一个允许采集的资料字段');
  }
  return {
    id: `website:${domain}`, name, domain, base_url, source_type: 'public_web', status: 'unverified',
    custom: true, network_enabled: false, connector_version: null, robots_status: 'unverified',
    terms_status: 'unverified', rights_status: 'needs_review', probe_result: 'not_probed', verified_fields: [],
    proposed_fields: [...new Set(input.fields)], role: textField(input.role ?? '', '用途说明', 240, true),
    preferred_region: regionField(input.region),
  };
}

function pathField(value) {
  const raw = textField(value, '目录路径', 300);
  let decoded;
  try { decoded = decodeURIComponent(raw); } catch { throw new Error('目录路径包含无效编码'); }
  if (!raw.startsWith('/') || decoded.startsWith('//') || /[\\?#\s\u0000-\u001f\u007f]/u.test(decoded) ||
      decoded.split('/').some(segment => segment === '..' || segment === '.') || decoded.includes('%')) {

function review(){let rows=state.works.filter(w=>!DATA.initial_published_ids.includes(w.id));if(state.reviewFilter==='pending')rows=rows.filter(w=>!state.decisions.some(d=>d.id===w.id));if(state.reviewFilter==='done')rows=rows.filter(w=>state.decisions.some(d=>d.id===w.id));if(state.reviewFilter==='conflict')rows=rows.filter(w=>w.status==='conflict'&&!state.decisions.some(d=>d.id===w.id));return intro('QUALITY / REVIEW','候选审核','对照字段证据完成裁决，确认后将资料加入展示预览。',button('运行样例任务','run-sample',true,state.running?'disabled':''))+`<div class="toolbar"><div class="tabs" aria-label="审核状态">${[['pending','待处理'],['conflict','字段冲突'],['done','已处理']].map(([key,label])=>`<button data-review-filter="${key}" class="${state.reviewFilter===key?'active':''}">${label}</button>`).join('')}</div><small class="muted">${state.admitted.size?'候选已接收，可开始演示审核':'预置待处理场景 · 运行样例后可操作'}</small></div><section class="panel">${rows.length?`<div class="table-wrap"><table><thead><tr><th>资料</th><th>候选状态</th><th>待确认事项</th><th>操作</th></tr></thead><tbody>${rows.map(w=>{const decision=state.decisions.find(d=>d.id===w.id);return `<tr><td><strong>${esc(w.title||'标题待补全')}</strong><span class="mono muted">${w.canonical_code}</span></td><td>${decision?statusBadge(decision.action):w.status==='pending'?badge('待审核','blue'):statusBadge(w.status)}</td><td>${w.errors.length?'缺少标题':w.conflicts.length?'发行日期不一致':'标题、厂牌与人物关系'}</td><td><button class="btn" data-action="review-detail" data-id="${w.id}" ${!state.admitted.has(w.id)?'disabled':''}>${decision?'查看结果':'查看候选'}</button></td></tr>`;}).join('')}</tbody></table></div>`:`<div class="empty">${icon('check')}<h3>当前没有${state.reviewFilter==='done'?'已处理记录':'待处理候选'}</h3><p>可切换其他状态，或创建一个演示批次。</p></div>`}</section>`;}

function catalogResults(){const q=compact(state.query);let rows=visibleWorks();if(state.entity==='works'){rows=rows.filter(w=>[w.canonical_code,w.title,w.studio_name,...w.performer_aliases].some(v=>compact(v).includes(q)));rows.sort((a,b)=>{if(state.sort==='release')return(b.release_date||'').localeCompare(a.release_date||'')||a.id.localeCompare(b.id);return b.updated_at.localeCompare(a.updated_at)||a.id.localeCompare(b.id);});const exact=rows.find(w=>q&&compact(w.canonical_code)===q);if(exact)rows=[exact,...rows.filter(w=>w!==exact)];return `<p class="catalog-count">找到 ${rows.length} 条资料${state.query?' · 当前查询：'+esc(state.query):''}</p>${rows.length?`<div class="catalog-grid">${rows.map(workCard).join('')}</div>`:noResults()}`;}const all=state.entity==='performers'?DATA.performers:DATA.studios;const entities=all.filter(e=>[e.name,...(e.aliases||[])].some(v=>compact(v).includes(q)));return `<p class="catalog-count">找到 ${entities.length} 个${state.entity==='performers'?'人物':'厂牌'}</p>${entities.length?`<div class="catalog-grid">${entities.map((e,i)=>`<button class="panel entity-card" data-action="entity-detail" data-id="${e.id}"><div class="entity-avatar">${state.entity==='performers'?String.fromCharCode(65+i):icon('catalog')}</div><h3>${esc(e.name)}</h3><p>${state.entity==='performers'?'合成人物':'合成厂牌'} · ${rows.filter(w=>state.entity==='performers'?w.performer_aliases.includes(e.name):w.studio_name===e.name).length} 条展示资料</p></button>`).join('')}</div>`:noResults()}`;}

function blueprint(){return intro('PROJECT / BLUEPRINT','设计、数据与架构','复用现有服务边界，把采集扩展为可验证、可恢复的资料供给链。')+`<div class="blueprint"><section class="panel"><div class="panel-head"><h2>目标数据链路</h2>${badge('Release B 设计')}</div><div class="panel-body"><div class="flow">${[['Go API','创建有界任务 / 来源开关'],['区域 Go Worker','租约、心跳、spool'],['Python Connector','允许来源 → 候选 JSONL'],['collector Schema','批次幂等、去重、冲突'],['运营审核 / Go 发布','revision → publication'],['Next.js 公开站','资料、搜索、关联与更新时间']].map(([t,d],i)=>`<div class="flow-node"><span>0${i+1}</span><strong>${t}</strong><small>${d}</small></div>`).join('')}</div><div class="note" style="margin-top:17px">${icon('info')}<span>Python 不持有数据库凭据。跨区结果由 Go Worker 签名提交；公开字段通过已审核版本投影。</span></div></div></section><section class="panel"><div class="panel-head"><h2>实施路线</h2><small>依赖顺序，不是上线承诺</small></div><div class="panel-body">${[['B0','合同与离线样例','本轮实现：43 条观测、36 个实体及交互演示。'],['B1','来源准入与实测解析','核验 JavDB / Jable 的规则、样本与字段含义。'],['B2','任务执行与批次接收','实现租约、心跳、故障恢复、区域隔离。'],['B3','冲突与发布闭环','字段裁决、独立复核、公开版本与缓存失效。'],['B4','稳定性与供给评估','测量完整率、真实准确性、积压与资源成本。']].map(([id,t,d])=>`<div class="milestone"><span class="mono">${id}</span><div><strong>${t}</strong><p>${d}</p></div></div>`).join('')}</div></section></div><section class="panel" style="margin-top:22px"><div class="panel-head"><h2>资料展示字段与责任</h2></div><div class="table-wrap"><table><thead><tr><th>展示需求</th><th>数据责任</th><th>发布规则</th></tr></thead><tbody><tr><td>番号 / 标题</td><td>作品候选与别名归一</td><td>必填；番号不能作为全局唯一键</td></tr><tr><td>发行日期</td><td>明确的发行字段证据</td><td>未知留空；禁止用站点上架日期替代</td></tr><tr><td>人物 / 厂牌</td><td>名称解析与候选关系</td><td>人物身份、成年状态及关系由人工确认</td></tr><tr><td>图片</td><td>已有受控媒体服务</td><td>权利与派生图审核；本演示使用默认图形</td></tr><tr><td>资料更新时间</td><td>公开版本的内容变更时间</td><td>采集轮询不得改变公开更新时间</td></tr></tbody></table></div></section>`;}
let toastTimer;function toast(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').hidden=false;toastTimer=setTimeout(()=>{$('#toast').hidden=true;},4300);}
function modal(title,body,foot=''){const d=$('#dialog');d.innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${title}</h2><button class="close" data-action="close" aria-label="关闭弹窗">×</button></div><div class="dialog-body">${body}</div>${foot?`<div class="dialog-foot">${foot}</div>`:''}`;if(!d.open)d.showModal();}
async function runJob(job){if(!CollectionConfig.canRunFixture(job)||state.running)return;state.running=true;job.status='running';job.logs.push('fixture · 开始处理，不访问外部站点');job.progress=10;render();const pause=()=>new Promise(r=>setTimeout(r,220));await pause();if(job.scenario==='timeout'||job.scenario==='schema'){job.status=job.scenario==='timeout'?'retry':'dead';job.logs.push(job.scenario==='timeout'?'模拟 CONNECTION_TIMEOUT：等待人工重试，候选未写入':'模拟 SCHEMA_CHANGED：停止该样例任务，候选未写入');job.scenario='normal';state.running=false;render();toast(job.status==='retry'?'超时场景已演示，可以重试任务':'结构变化场景已演示，请修复后新建任务');return;}job.progress=40;job.logs.push('合同校验完成 · 43 条输入 / 40 条唯一观测');render();await pause();const before=state.admitted.size;state.works.forEach(w=>state.admitted.add(w.id));job.progress=75;job.logs.push('实体组装完成 · 36 个实体 / 2 组冲突 / 2 条缺失');render();await pause();job.progress=100;job.status='completed';job.logs.push(before?'重复批次：新增实体 0，保留既有审核决定':'候选已接收：展示预置 24 条，待处理 12 条');state.running=false;render();toast(before?'重复批次已处理，没有新增重复资料':'样例运行完成：12 条候选等待处理');}
function runSample(){let job=state.jobs.find(j=>CollectionConfig.canRunFixture(j)&&j.status==='pending');if(!job){job=newJob('作品增量 · 重放样例','normal');}runJob(job);}
function newJob(title,scenario){const job={id:'JOB-'+String(state.jobs.length+1).padStart(3,'0'),title,scenario,status:'pending',progress:0,logs:[],source_id:'fixture',execution_mode:'fixture'};state.jobs.push(job);return job;}
function reviewDetail(id){const w=state.works.find(w=>w.id===id);if(!w||!state.admitted.has(id))return;const decision=state.decisions.find(d=>d.id===id);const body=`<div class="actions" style="justify-content:space-between;margin-bottom:16px"><span class="mono">${w.canonical_code}</span>${decision?statusBadge(decision.action):w.status==='pending'?badge('待审核','blue'):statusBadge(w.status)}</div><h2>${esc(w.title||'标题待补全')}</h2><div class="detail-grid" style="margin:18px 0"><div class="kv"><span>厂牌</span><b>${esc(w.studio_name)}</b></div><div class="kv"><span>人物</span><b>${esc(w.performer_aliases.join(' / '))}</b></div><div class="kv"><span>编辑身份</span><b>fixture-editor（模拟）</b></div><div class="kv"><span>复核身份</span><b>fixture-reviewer（模拟）</b></div></div>${w.errors.length?`<div class="note orange">${icon('info')}<span>${esc(w.errors.join('；'))}。当前候选不能加入展示预览。</span></div>`:''}${w.conflicts.map(c=>`<fieldset style="border:0;padding:0;margin:18px 0"><legend style="font-size:12px">${c.field==='release_date'?'发行日期':esc(c.field)}冲突 · 选择保留值</legend>${c.values.map((v,i)=>`<label class="radio-row"><input type="radio" name="resolution-${c.field}" value="${i}" ${decision?'disabled':''}>${esc(v.value)}<small>${esc(v.source)}</small></label>`).join('')}</fieldset>`).join('')}<details class="evidence"><summary>查看内部来源证据 · ${w.evidence.length} 条合成观测</summary><pre>${esc(JSON.stringify(w.evidence,null,2))}</pre></details>${decision?`<div class="note">演示决定：${decision.action==='approved'?'确认并加入资料预览':'退回'} · ${esc(decision.at)}${decision.resolutions.length?' · 已选值：'+esc(decision.resolutions.map(r=>r.value).join(' / ')):''}</div>`:w.errors.length?'':`<label class="radio-row"><input id="review-confirm" type="checkbox">以演示复核员确认资料字段与人物关联</label><small class="muted">此操作仅模拟独立复核，不代表真实身份认证或权利核验。</small>`}`;modal('候选详情',body,button('关闭','close')+(!decision?button('退回候选','reject',false,`data-id="${id}"`)+button('确认并加入预览','approve',true,`data-id="${id}" ${w.errors.length?'disabled':''}`):''));}
function decide(id,action){const w=state.works.find(w=>w.id===id);if(!w||!state.admitted.has(id)||state.decisions.some(d=>d.id===id))return;const resolutions=[];if(action==='approved'){if(w.errors.length)return;if(!$('#review-confirm')?.checked){toast('请先确认资料字段与人物关联');return;}for(const conflict of w.conflicts){const selected=$(`input[name="resolution-${conflict.field}"]:checked`);if(!selected){toast('请选择需要保留的冲突字段值');return;}resolutions.push({field:conflict.field,value:conflict.values[Number(selected.value)].value});}for(const r of resolutions)w[r.field]=r.value;w.updated_at=new Date().toISOString();state.published.add(id);}state.decisions.push({id,action,resolutions,at:new Date().toISOString(),editor:'fixture-editor',reviewer:'fixture-reviewer',synthetic:true});$('#dialog').close();render();toast(action==='approved'?'已加入资料预览，可在作品列表查询':'候选已退回，未加入资料预览');}
function workDetail(id){const w=visibleWorks().find(w=>w.id===id);if(!w)return;modal('作品资料',`<div class="detail-top"><div class="cover"><small>DEMO ARCHIVE</small><span class="cover-code">${w.canonical_code.slice(-3)}</span><small>合成样本</small></div><div><span class="mono muted">${w.canonical_code}</span><h2>${esc(w.title)}</h2><small class="muted">资料更新时间 ${esc(w.updated_at.slice(0,10))}</small><div style="margin-top:14px">${button('复制番号','copy-code',false,`data-id="${id}"`)}</div></div></div><div class="detail-grid"><div class="kv"><span>番号</span><b>${w.canonical_code}</b></div><div class="kv"><span>发行日期</span><b>${w.release_date||'未知'}</b></div><div class="kv"><span>厂牌</span><button data-action="related" data-query="${esc(w.studio_name)}">${esc(w.studio_name)} ↗</button></div><div class="kv"><span>人物</span><div>${w.performer_aliases.map(p=>`<button data-action="related" data-query="${esc(p)}">${esc(p)} ↗</button>`).join(' ')}</div></div></div><div class="note" style="margin-top:19px">本作品、人物和厂牌均为合成演示资料，封面为默认图形。</div>`,button('返回资料列表','close'));}
function entityDetail(id){const e=[...DATA.performers,...DATA.studios].find(e=>e.id===id);if(!e)return;const works=visibleWorks().filter(w=>w.studio_name===e.name||w.performer_aliases.includes(e.name));modal(esc(e.name),`<small class="muted">合成资料 · 关联作品 ${works.length} 条</small><div style="margin-top:16px">${works.map(w=>`<button class="kv" style="width:100%;text-align:left" data-action="work-detail" data-id="${w.id}"><span>${w.canonical_code}</span><b>${esc(w.title)} ↗</b></button>`).join('')}</div>`,button('关闭','close'));}
document.addEventListener('click',async e=>{const target=e.target.closest('button');if(!target||target.disabled)return;if(target.dataset.nav){navigate(target.dataset.nav);return;}if(target.dataset.reviewFilter){state.reviewFilter=target.dataset.reviewFilter;render();return;}if(target.dataset.entity){state.entity=target.dataset.entity;render();return;}const action=target.dataset.action,id=target.dataset.id;if(action==='catalog'){navigate('catalog');}if(action==='run-sample')runSample();if(action==='run-job')runJob(state.jobs.find(j=>j.id===id));if(action==='create-job')createJob();if(action==='add-website')addWebsite();if(action==='create-source-job')createJob(id);if(action==='plan-detail')planDetail(id);if(action==='close')$('#dialog').close();if(action==='cancel-job')cancelJob(id);if(action==='job-detail'){const j=state.jobs.find(j=>j.id===id);modal('任务日志 · '+j.id,`<div class="actions" style="margin-bottom:16px">${statusBadge(j.status)}<small class="muted">${esc(j.title)}</small></div><div class="log">${j.logs.length?j.logs.map(l=>`<p>${esc(l)}</p>`).join(''):'尚未执行，没有日志。'}</div>`,button('关闭','close'));}if(action==='source-detail'){const s=allSources().find(s=>s.id===id);modal(esc(s.name)+' · 接入说明',`<p style="font-size:12px;color:var(--muted)">${esc(s.role)}</p><div class="kv" style="margin-top:20px"><span>已验证真实字段</span><b>0</b></div><div class="kv"><span>连接器版本</span><b>${esc(s.connector_version||'尚未建立')}</b></div><div class="kv"><span>候选字段</span><b>${esc(s.proposed_fields.join(' / '))}</b></div><div class="note" style="margin-top:18px">${s.id==='fixture'?'本地生成 43 条观测。fixture 的置信度只表达合成值确定性，不代表真实来源可信度。':'下一步：确认来源条款与 robots、允许区域及频率，保存允许使用的页面样本，核对日期语义和解析字段，再注册固定版本连接器。'}</div>`,button('关闭','close'));}if(action==='review-detail')reviewDetail(id);if(action==='approve')decide(id,'approved');if(action==='reject')decide(id,'rejected');if(action==='work-detail')workDetail(id);if(action==='entity-detail')entityDetail(id);if(action==='clear-search'){state.query='';render();$('#catalog-search').focus();}if(action==='related'){state.query=target.dataset.query;state.entity='works';$('#dialog').close();navigate('catalog');}if(action==='copy-code'){const w=visibleWorks().find(w=>w.id===id);try{await navigator.clipboard.writeText(w.canonical_code);toast('番号已复制');}catch{toast('浏览器未允许复制，请手动复制：'+w.canonical_code);}}});
document.addEventListener('submit',e=>{if(!['job-form','website-form'].includes(e.target.id))return;e.preventDefault();const form=new FormData(e.target);if(e.target.id==='website-form')submitWebsite(form,e.submitter?.dataset.createTask==='true');else submitJob(form);});
document.addEventListener('input',e=>{if(e.target.id==='catalog-search'){state.query=e.target.value;$('#catalog-results').innerHTML=catalogResults();}});
document.addEventListener('change',e=>{if(e.target.id==='job-source')switchJobSource();if(e.target.id==='catalog-sort'){state.sort=e.target.value;$('#catalog-results').innerHTML=catalogResults();}});
$('#export').addEventListener('click',exportData);window.addEventListener('hashchange',()=>{state.view=location.hash.slice(1);render();});state.view=location.hash.slice(1)||'dashboard';render();
</script>
</body>
</html>
