<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'">
<title>Jable · 真实演员资料库</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#ecebea;background:#101312;color-scheme:dark}*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:1360px;margin:auto;padding:36px 36px 0}.eyebrow{color:#b6d893;letter-spacing:.18em;font-size:12px;font-weight:700}.top{display:flex;justify-content:space-between;align-items:center;gap:24px}.local{color:#b8c9ae;font-size:12px;border:1px solid #45563b;border-radius:20px;padding:9px 13px}h1{font-size:clamp(30px,5vw,55px);letter-spacing:-.05em;margin:16px 0}header p,.note{font-size:14px;color:#9da89e;line-height:1.9;max-width:860px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:30px 0}.stat{padding:22px;border:1px solid #333c33;border-radius:14px;background:#1a211b}.stat b{font-size:34px;display:block;margin-bottom:7px}.stat span{color:#a5b49f;font-size:13px}.toolbar{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:24px}input[type=search]{background:#1d251e;border:1px solid #424d3d;color:#fff;border-radius:9px;padding:13px 16px;width:min(400px,100%);font:inherit}label{font-size:13px;color:#bdc6b8}#result-count{font-size:13px;color:#a3af9e;margin-left:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:18px}.card{background:#1b211c;border:1px solid #333c34;border-radius:13px;overflow:hidden}.portrait{width:100%;aspect-ratio:1;display:block;object-fit:contain;background:#242c25}.placeholder{display:flex;align-items:center;justify-content:center;flex-direction:column;color:#7e8d7a;gap:8px}.placeholder span{font-size:35px}.placeholder small{font-size:11px}.body{padding:15px}h2{font-size:16px;line-height:1.5;margin:6px 0 12px}.tag{font-size:10px;color:#bbd996;letter-spacing:.04em}.missing{color:#bfb194}.body p{color:#96a18f;font-size:11px;margin:7px 0}button{font:inherit;cursor:pointer}.details-button{border:0;background:none;color:#c2d3b5;padding:10px 0 0;font-size:12px}.empty{padding:50px;text-align:center;color:#a0aa97}dialog{background:#1c241d;color:#efefe8;border:1px solid #536049;border-radius:20px;padding:25px;max-width:560px;width:calc(100% - 30px);max-height:90vh}dialog::backdrop{background:#000b}dialog img{width:150px;height:150px;object-fit:contain;border-radius:12px}dialog h2{font-size:23px}dl{display:grid;grid-template-columns:90px 1fr;gap:13px;font-size:12px;line-height:1.7}dt{color:#9cac92}dd{margin:0;overflow-wrap:anywhere}#close-detail{float:right;border:1px solid #536049;border-radius:8px;color:#dae4d3;background:#293429;padding:7px 12px}footer{padding-bottom:35px;color:#8c9a85;font-size:12px;line-height:1.8}.hidden{display:none!important}@media(max-width:600px){header,main,footer{padding-left:18px;padding-right:18px}.top{align-items:flex-start}.local{white-space:nowrap}.stats{gap:8px}.stat{padding:15px 11px}.stat b{font-size:28px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}#result-count{margin-left:0}.body{padding:12px}}
</style></head><body>
<header><div class="top"><span class="eyebrow">JABLE / ACTOR ARCHIVE</span><span class="local">● 本地保存 · 离线可用</span></div><h1>真实演员资料库</h1><p>来自公开演员列表的姓名与普通头像，图片已保存至本机。头像缺失会明确标注；不会用其他演员或其他网站的图片替代。</p><div class="stats"><div class="stat"><b id="total">0</b><span>已入库演员</span></div><div class="stat"><b id="avatars">0</b><span>真实本地头像</span></div><div class="stat"><b id="missing">0</b><span>尚无本地头像</span></div></div><p class="note">这是有范围的真实采集，不代表全站完整。分页覆盖、未采页面和图片缺项分别保存在采集报告与 data-audit.json 中。所有资料仅用于内部验收，权利状态待审核。</p></header>
<main><div class="toolbar"><input id="search" type="search" placeholder="按姓名或来源 ID 搜索" aria-label="搜索演员"><label><input id="only-avatars" type="checkbox"> 只看已有头像</label><span id="result-count"></span></div><section class="grid" id="grid"></section><p class="empty hidden" id="empty">没有符合条件的演员</p></main>
<footer><p id="coverage-note"></p>资料来源：Jable 公开演员列表 · 不加载外部图片、不播放视频 · 采集时间、尺寸和文件校验值可在卡片详情中查看。</footer>
<dialog id="detail"><button id="close-detail">关闭</button><div id="detail-content"></div></dialog>
<script type="application/json" id="dataset">__DATASET__</script>
<script>
const data=JSON.parse(document.getElementById('dataset').textContent),$=id=>document.getElementById(id);
const esc=value=>String(value??'未记录').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('total').textContent=data.counts.performers;$('avatars').textContent=data.counts.avatars;$('missing').textContent=data.counts.without_downloaded_avatar;
if(data.coverage)$('coverage-note').textContent=`分页覆盖：${data.coverage.captured_page_count} / ${data.coverage.discovered_last_page} 页；重复记录 ${data.coverage.duplicate_occurrences} 次已按来源 ID 去重。核对时间：${data.coverage.checked_at}。页码扫描不等于全站无遗漏。`;
function render(){const term=$('search').value.toLowerCase(),only=$('only-avatars').checked;const rows=data.performers.filter(p=>(!only||p.avatar)&&`${p.name} ${p.external_id}`.toLowerCase().includes(term));$('result-count').textContent=`显示 ${rows.length} / ${data.performers.length}`;$('empty').classList.toggle('hidden',rows.length>0);$('grid').innerHTML=rows.map(p=>`<article class="card">${p.avatar?`<img class="portrait" src="${esc(p.avatar.url)}" alt="${esc(p.name)}">`:'<div class="portrait placeholder"><span>—</span><small>尚无本地头像</small></div>'}<div class="body"><span class="tag ${p.avatar?'':'missing'}">${p.avatar?'真实头像 · 已保存':'姓名已保存 · 头像缺项'}</span><h2>${esc(p.name)}</h2><p>${p.avatar?`${p.avatar.width} × ${p.avatar.height} · ${(p.avatar.byte_size/1024).toFixed(1)} KB`:'缺项已记录，可后续补采'}</p><button class="details-button" data-id="${esc(p.performer_id)}">查看保存信息 ↗</button></div></article>`).join('');}
$('search').addEventListener('input',render);$('only-avatars').addEventListener('change',render);
$('grid').addEventListener('click',event=>{const button=event.target.closest('[data-id]');if(!button)return;const p=data.performers.find(row=>row.performer_id===button.dataset.id),a=p.avatar;$('detail-content').innerHTML=`${a?`<img src="${esc(a.url)}" alt="${esc(p.name)}">`:''}<h2>${esc(p.name)}</h2><dl><dt>来源 ID</dt><dd>${esc(p.external_id)}</dd><dt>来源页面</dt><dd>${esc(p.source_page_url||p.profile_url)}</dd><dt>采集时间</dt><dd>${esc(p.checked_at)}</dd><dt>列表作品数</dt><dd>${esc(p.work_count)}</dd><dt>头像状态</dt><dd>${a?'真实文件已保存':'尚无本地头像，见缺项清单'}</dd><dt>SHA-256</dt><dd>${a?esc(a.sha256):'—'}</dd><dt>权利状态</dt><dd>needs_review / staging</dd></dl>`;$('detail').showModal();});$('close-detail').addEventListener('click',()=>$('detail').close());render();
</script></body></html>
