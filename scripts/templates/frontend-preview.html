const actorsById=new Map(D.actors.map(a=>[a.id,a]));D.actors.forEach(a=>a._search=normalize([a.name,a.external_id,...(a.aliases||[])].join(' ')));
const collator=new Intl.Collator('zh');const actorOrder={name:[...D.actors].sort((a,b)=>collator.compare(a.name,b.name))};actorOrder.portrait=[...actorOrder.name].sort((a,b)=>Boolean(b.avatar)-Boolean(a.avatar));actorOrder['work-count']=[...actorOrder.name].sort((a,b)=>(b.work_count??-1)-(a.work_count??-1));
const state={view:'overview',query:'',filter:'all',sort:'portrait',layout:'grid',page:1,taskStatus:'all',source:'all'};const pageSize=48;let composing=false,toastTimer;
function readRoute(){const [view,q='']=(location.hash.slice(1)||'overview').split('?'),p=new URLSearchParams(q);state.view=labels[view]?view:'overview';state.query=p.get('q')||'';state.filter=p.get('filter')||'all';state.sort=p.get('sort')||'portrait';state.layout=p.get('layout')==='list'?'list':'grid';state.page=Number.isFinite(Number(p.get('page')))?Math.max(1,Math.floor(Number(p.get('page')))||1):1;state.taskStatus=p.get('status')||'all';state.source=p.get('source')||'all';}
function route(values={},replace=false){Object.assign(state,values);const p=new URLSearchParams();for(const [key,value] of Object.entries({q:state.query,filter:state.filter,sort:state.sort,layout:state.layout,page:state.page,status:state.taskStatus,source:state.source})){const defaults={q:'',filter:'all',sort:'portrait',layout:'grid',page:1,status:'all',source:'all'};if(value!==defaults[key])p.set(key,value);}const hash='#'+state.view+(p.size?'?'+p:'');if(replace){history.replaceState(null,'',hash);}else {history.replaceState({scrollY:window.scrollY},'',location.href);history.pushState({scrollY:window.scrollY},'',hash)};render();}
function nav(view,extras={}){route({view,query:'',filter:'all',page:1,taskStatus:'all',source:'all',...extras});window.scrollTo(0,0);$('main').focus({preventScroll:true});}
function face(a){return a.avatar?`<img class="face" src="${esc(a.avatar.url)}" alt="${esc(a.name)}的头像" width="56" height="56" loading="lazy" decoding="async">`:`<span class="face blank" aria-label="尚无头像">${esc(Array.from(a.name||'·')[0])}</span>`;}
function status(value){return `<span class="status ${esc(value)}">${esc(stateName[value]||value)}</span>`;}
function title(eyebrow,name,description,action=''){return `<section class="intro"><div><div class="eyebrow">${eyebrow}</div><h1>${name}</h1><p>${description}</p></div>${action?`<div class="actions">${action}</div>`:''}</section>`;}
function footer(){return `<footer class="footer"><span>幕鉴 · 数据快照 ${esc(stamp(D.snapshot_at))}</span><span>仅浏览与导出 · 操作不会触发采集</span></footer>`;}
function sourceReason(s){if(s.connection_error==='connection_reset')return '最近一次连接被重置，尚未取得有效页面。任务已保留，待来源恢复后继续。';if(s.http_status===403)return '来源返回 403，采集已停止。已保存页面与入库记录可继续使用。';if(/RESET|RUNTIME|NETWORK/.test(s.error_code||''))return '来源连接未完成，任务已保留。恢复网络后可从断点继续。';return s.status==='blocked'?'来源暂时无法继续采集，任务和已保存数据均已保留。':'来源状态以最后一次采集报告为准。';}
function overview(){const c=D.counts,coverage=c.performers?(c.avatars/c.performers*100).toFixed(1):'0.0';return title('WORKSPACE / OVERVIEW','资料的现状，一目了然。','从来源到资料，先看进展，再处理影响补全的问题。',`<button class="btn primary" data-nav="actors">浏览演员资料 ${icon('arrow')}</button>`)+`<section class="stats" aria-label="数据概况">${[[c.performers,'已保存演员','actors','稳定来源 ID 去重','actors'],[c.avatars,'普通头像','image',`覆盖 <strong>${coverage}%</strong> 的演员`,'actors','portrait'],[c.tasks_pending,'待处理任务','clock','含列表发现与演员详情补全','tasks','','pending'],[c.tasks_blocked,'阻塞任务','alert','来源恢复后可从断点继续','tasks','','blocked']].map(([value,label,symbol,note,target,filter,taskStatus])=>`<button class="stat" data-nav="${target}" data-view-filter="${filter||'all'}" data-task-filter="${taskStatus||'all'}"><span class="stat-top">${label}${icon(symbol)}</span><strong class="stat-value">${N(value)}</strong><span class="stat-foot">${note}</span></button>`).join('')}</section><div class="dashboard-columns"><div class="stack"><section class="panel"><div class="panel-head"><h2>先处理影响采集的问题</h2><button class="link-btn" data-nav="sources">来源详情 ${icon('arrow')}</button></div><div class="panel-body"><div class="alert">${icon('alert')}<div><strong>${D.sources.filter(s=>s.status==='blocked').length} 个来源需要关注</strong><p>任务已保留，不会丢失已保存的演员资料。</p></div></div>${D.sources.map(s=>`<div class="source-line"><span class="source-monogram">${esc(s.name.slice(0,1))}</span><div class="source-text"><h3>${esc(s.name)}</h3><p>${s.http_status===403?'访问被拒绝 · HTTP 403':s.status==='blocked'?'连接未完成 · 等待恢复':'已记录来源状态'}</p></div>${status(s.status)}</div>`).join('')}</div><div class="panel-foot">本轮保存 ${N(D.summary.successful_pages)} 页 · ${N(D.summary.new_observations)} 条内容更新 · 截至 ${esc(date(D.summary.completed_at))}</div></section><section class="panel"><div class="panel-head"><h2>已经保存的演员资料</h2><button class="link-btn" data-nav="actors">查看全部 ${icon('arrow')}</button></div><div class="panel-body"><div class="mini-actors">${D.actors.filter(a=>a.avatar).slice(0,4).map(a=>`<button class="mini-actor" data-actor="${esc(a.id)}">${face(a)}<strong>${esc(a.name)}</strong><small>${a.work_count==null?'作品数未记录':N(a.work_count)+' 部列表作品'}</small></button>`).join('')}</div></div></section></div><div class="stack"><section class="panel"><div class="panel-head"><h2>资料覆盖</h2><small>按演员统计</small></div><div class="panel-body"><p class="section-note">缺失信息保留为空，补全进度可追溯。</p>${[['姓名与来源资料',c.performers,100,false],['普通头像',c.avatars,Number(coverage),true],['别名',c.performers-(c.missing_fields?.aliases||0),100*(c.performers-(c.missing_fields?.aliases||0))/Math.max(1,c.performers),false]].map(([label,count,percent,amber])=>`<div class="quality"><div class="quality-label"><span>${label}</span><b>${N(count)} <span>/ ${N(c.performers)}</span></b></div><div class="track"><i class="${amber?'amber':''}" style="width:${percent}%"></i></div></div>`).join('')}<button class="link-btn" data-nav="gaps">查看需要补充的资料 ${icon('arrow')}</button></div></section><section class="panel"><div class="panel-head"><h2>这份快照包含什么</h2></div><div class="panel-body"><p class="section-note" style="margin-bottom:12px">演员姓名、列表作品数、普通头像和来源记录。部分字段仍需通过详情页补充。</p><div class="source-line"><div class="source-text"><h3>${N(c.tasks_completed)} / ${N(c.tasks_total)}</h3><p>本轮队列中已完成的任务</p></div>${icon('tasks')}</div></div></section></div></div>`;}
function actorRows(){const q=normalize(state.query);return (actorOrder[state.sort]||actorOrder.portrait).filter(a=>(!q||a._search.includes(q))&&(state.source==='all'||a.source_id===state.source)&&(state.filter==='all'||state.filter==='portrait'&&a.avatar||state.filter==='missing-avatar'&&!a.avatar||state.filter.startsWith('field-')&&a.missing_fields.includes(state.filter.slice(6))));}
function actorPage(){return title('LIBRARY / ACTORS','演员资料','搜索已保存的演员，查看作品数、普通头像与待补字段。',`<button class="btn" data-action="export-actors">${icon('download')} 导出筛选结果</button>`)+`<div class="toolbar"><label class="search">${icon('search')}<input id="actor-search" type="search" aria-label="搜索演员姓名、别名或来源 ID" placeholder="搜索姓名、别名或来源 ID" value="${esc(state.query)}"><kbd>/</kbd></label><select id="actor-sort" aria-label="演员排序"><option value="portrait" ${state.sort==='portrait'?'selected':''}>有头像优先</option><option value="name" ${state.sort==='name'?'selected':''}>按姓名排序</option><option value="work-count" ${state.sort==='work-count'?'selected':''}>列表作品数从多到少</option></select><div class="view-switch" aria-label="显示方式"><button data-layout="grid" aria-pressed="${state.layout==='grid'}" aria-label="卡片视图">${icon('grid')}</button><button data-layout="list" aria-pressed="${state.layout==='list'}" aria-label="列表视图">${icon('list')}</button></div></div><div class="filter-line"><div class="filters" aria-label="头像筛选">${[['all','全部演员',D.counts.performers],['portrait','已有头像',D.counts.avatars],['missing-avatar','缺少头像',D.counts.missing_avatars]].map(([id,label,count])=>`<button class="filter" data-filter="${id}" aria-pressed="${state.filter===id}">${label}<span>${N(count)}</span></button>`).join('')}</div><span id="result-count" class="result-count" role="status" aria-live="polite"></span></div>${state.filter.startsWith('field-')?`<div class="active-scope"><span>当前筛选：缺少${esc(fieldName[state.filter.slice(6)]||state.filter.slice(6))}</span><button data-filter="all">清除此条件</button></div>`:''}<div id="actor-results"></div>`;}
function pagination(total){const pages=Math.max(1,Math.ceil(total/pageSize));state.page=Math.min(state.page,pages);const start=total?(state.page-1)*pageSize+1:0,end=Math.min(state.page*pageSize,total);return `<div class="pagination"><span>第 ${N(start)}–${N(end)} 条，共 ${N(total)} 条</span><div class="actions"><button class="btn" data-page="${state.page-1}" ${state.page===1?'disabled':''} aria-label="上一页">←</button><span>${state.page} / ${pages}</span><button class="btn" data-page="${state.page+1}" ${state.page>=pages?'disabled':''} aria-label="下一页">→</button></div></div>`;}
function renderActors(){const rows=actorRows();const pages=Math.max(1,Math.ceil(rows.length/pageSize));state.page=Math.min(state.page,pages);$('result-count').textContent=`找到 ${N(rows.length)} 位演员`;const slice=rows.slice((state.page-1)*pageSize,state.page*pageSize);$('actor-results').innerHTML=slice.length?`<div class="${state.layout==='list'?'list-view':'actors-grid'}">${slice.map(a=>`<article class="actor-card"><button class="actor-open" data-actor="${esc(a.id)}" aria-label="查看${esc(a.name)}的资料"><span class="actor-top">${face(a)}<span><strong class="actor-name">${esc(a.name)}</strong><span class="actor-code">${esc(a.external_id)}</span></span></span><span class="actor-bottom"><span><b>${a.work_count==null?'未记录':N(a.work_count)}</b> ${a.work_count==null?'作品数':'部列表作品'}</span><span>${a.avatar?'头像已保存':'尚无头像'}</span></span></button></article>`).join('')}</div>${pagination(rows.length)}`:`<div class="empty">${icon('search')}<h2>没有找到对应演员</h2><p>试试其他姓名、来源 ID，或清除当前筛选。</p><button class="btn" data-action="clear-search">清除搜索和筛选</button></div>`;}
function gaps(){const fields=D.counts.missing_fields||{};return title('QUALITY / GAPS','让每一次补全，都有目标。','按缺失字段定位演员；没有来源证据的资料会继续保留为空。',`<button class="btn" data-action="export-gaps">${icon('download')} 导出缺项清单</button>`)+`<div class="gaps-grid">${['avatar','aliases','biography','birth_date','height','name'].map(field=>`<button class="gap-card" data-gap="${field}"><span>${esc(fieldName[field])}待补充</span><strong>${N(fields[field])}</strong><span>${fields[field]?'查看对应演员 →':'当前已保存资料均包含此项'}</span></button>`).join('')}</div><div class="inline-note">${icon('gaps')}<span>缺头像与下载失败分开记录；别名、生日等不能从同名人物或照片推断。这里的“待补充”表示当前快照没有取得该信息。</span></div><section class="panel"><div class="panel-head"><h2>补全的下一步</h2><button class="link-btn" data-nav="tasks">查看详情任务 ${icon('arrow')}</button></div><div class="panel-body"><div class="source-line"><span class="source-monogram">01</span><div class="source-text"><h3>恢复来源访问</h3><p>先确认阻塞原因，再继续已保存的任务队列。</p></div></div><div class="source-line"><span class="source-monogram">02</span><div class="source-text"><h3>按演员逐项补充</h3><p>优先补全缺头像演员，保留原字段值与来源时间。</p></div></div><div class="source-line"><span class="source-monogram">03</span><div class="source-text"><h3>核对新增字段</h3><p>取得信息与审核发布是不同状态，资料不会自动公开。</p></div></div></div></section>`;}
function taskRows(){return D.tasks.filter(t=>(state.taskStatus==='all'||t.status===state.taskStatus)&&(state.source==='all'||t.source_id===state.source)&&(!state.query||t.kind==='profile'&&normalize(new URL(t.url).pathname.split('/').filter(Boolean).at(-1))===normalize(state.query)));}
function tasks(){const rows=taskRows();state.page=Math.min(state.page,Math.max(1,Math.ceil(rows.length/pageSize)));return title('OPERATIONS / TASKS','采集任务','任务状态来自持久队列快照，已保存的证据和断点可追溯。',`<button class="btn" data-action="export-tasks">${icon('download')} 导出当前任务</button>`)+`<div class="toolbar"><div class="filters" aria-label="任务状态筛选">${[['all','全部'],['blocked','已阻塞'],['pending','待处理'],['completed','已完成']].map(([value,label])=>`<button class="filter" data-task-status="${value}" aria-pressed="${state.taskStatus===value}">${label}</button>`).join('')}</div><select id="task-source" aria-label="任务来源"><option value="all">全部来源</option>${D.sources.map(s=>`<option value="${s.id}" ${state.source===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>${state.query?`<div class="active-scope"><span>当前来源对象：${esc(state.query)}</span><button data-action="clear-task-query">查看全部来源对象</button></div>`:''}<section class="panel"><div class="task-state-counts"><span>待处理 <b>${N(D.counts.tasks_pending)}</b></span><span>已阻塞 <b>${N(D.counts.tasks_blocked)}</b></span><span>已完成 <b>${N(D.counts.tasks_completed)}</b></span></div>${rows.length?`<div class="table-wrap"><table><caption class="sr-only">采集任务快照</caption><thead><tr><th>任务 / 来源对象</th><th>来源</th><th>状态</th><th>尝试次数</th><th>记录</th></tr></thead><tbody>${rows.slice((state.page-1)*pageSize,state.page*pageSize).map(t=>`<tr><td><strong>${esc(kindName[t.kind]||t.kind)}</strong><small>${esc(t.url.replace(/^https:\/\/[^/]+/,''))}</small></td><td>${esc(sourceName(t.source_id))}</td><td>${status(t.status)}</td><td>${N(t.attempts)}</td><td><button class="table-link" data-task="${esc(t.id)}">查看详情 ↗</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><h2>没有符合条件的任务</h2><p>调整来源或状态筛选后再试。</p></div>`}</section>${pagination(rows.length)}<p class="section-note" style="margin-top:17px">当前为队列快照，可查看记录并导出筛选结果。</p>`;}
function sources(){return title('CONNECTIONS / SOURCES','来源状态','查看最近一次访问结果，明确哪些问题正在影响资料补全。')+`<div class="source-cards">${D.sources.map(s=>`<section class="panel"><div class="panel-body"><div class="source-line"><span class="source-monogram">${esc(s.name.slice(0,1))}</span><div class="source-text"><h2>${esc(s.name)}</h2><p>${s.id==='jable_reference'?'jable.tv':'javdb.com'}</p></div>${status(s.status)}</div><dl class="source-meta"><div><dt>已保存演员</dt><dd>${N(D.actors.filter(a=>a.source_id===s.id).length)}</dd></div><div><dt>最近检查</dt><dd>${esc(date(s.checked_at))}</dd></div><div><dt>来源响应</dt><dd>${s.http_status?'HTTP '+s.http_status:'未取得有效响应'}</dd></div><div><dt>受影响任务</dt><dd>${N(D.tasks.filter(t=>t.source_id===s.id&&t.status!=='completed').length)}</dd></div></dl><div class="source-reason">${sourceReason(s)}</div><button class="link-btn" style="margin-top:16px" data-source-tasks="${s.id}">查看该来源任务 ${icon('arrow')}</button></div></section>`).join('')}</div><div class="inline-note" style="margin-top:22px">${icon('clock')}<span>来源状态来自采集证据。页面没有自动刷新或联网探测，不会将历史可达状态显示为实时健康。</span></div>`;}
function render(){$('nav').innerHTML=Object.entries(labels).map(([id,label])=>`<a href="#${id}" data-nav="${id}" aria-label="${label}" ${state.view===id?'aria-current="page"':''}>${icon(id)}<span>${label}</span>${id==='actors'?`<small>${N(D.counts.performers)}</small>`:id==='tasks'?`<small>${N(D.counts.tasks_total)}</small>`:''}</a>`).join('');$('breadcrumb').textContent=labels[state.view];$('snapshot-time').textContent='快照 '+stamp(D.snapshot_at);$('main').innerHTML=({overview,actors:actorPage,gaps,tasks,sources}[state.view])()+footer();if(state.view==='actors')renderActors();document.title=`${labels[state.view]} · 幕鉴设计预览`;}
function showActor(id){const a=actorsById.get(id);if(!a)return;const fields=[['姓名',a.name],['来源',sourceName(a.source_id)],['别名',a.aliases?.join(' / ')],['简介',a.biography],['生日',a.birth_date],['身高',a.height],['列表作品数',a.work_count==null?null:N(a.work_count)],['最近观察',stamp(a.checked_at)]];$('detail-title').textContent='演员资料';$('detail-content').innerHTML=`<div class="detail-person">${face(a)}<div><h3>${esc(a.name)}</h3><p>${esc(a.external_id)}</p></div></div><div class="detail-label">已保存的信息</div><dl class="detail-fields">${fields.map(([key,value])=>`<div><dt>${key}</dt><dd>${value?esc(value):'<span class="missing-value">尚未记录</span>'}</dd></div>`).join('')}</dl><div class="detail-label">仍需补充</div><div class="detail-tags">${a.missing_fields.map(f=>`<span>${esc(fieldName[f]||f)}</span>`).join('')||'<span>当前没有记录的缺项</span>'}</div><details class="detail-section"><summary>来源与保存记录</summary><p class="muted" style="font-size:12px;overflow-wrap:anywhere">${esc(a.profile_url)}</p><pre>${esc(JSON.stringify(a.field_provenance||{checked_at:a.checked_at,source_id:a.source_id},null,2))}</pre></details><button class="btn" data-actor-task="${esc(a.id)}">查看该演员的补全任务 ${icon('arrow')}</button>`;$('detail').showModal();}
function showTask(id){const t=D.tasks.find(t=>t.id===id);if(!t)return;$('detail-title').textContent='任务记录';$('detail-content').innerHTML=`<div class="eyebrow">TASK / ${esc(t.kind.toUpperCase())}</div><h3 style="font-size:23px;margin-bottom:15px">${esc(kindName[t.kind]||t.kind)}</h3>${status(t.status)}<dl class="detail-fields" style="margin-top:20px">${[['来源',sourceName(t.source_id)],['来源对象',t.url],['尝试次数',t.attempts],['最近记录',t.checked_at?stamp(t.checked_at):'尚未记录'],['错误代码',t.error_code||'无']].map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl><div class="inline-note">已保存的任务会保留当前状态。本设计样稿不会执行重试或修改队列。</div>`;$('detail').showModal();}
function download(rows,name){const clean=rows.map(({_search,...value})=>value),blob=new Blob([JSON.stringify({snapshot_at:D.snapshot_at,count:clean.length,records:clean},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast(`已导出 ${N(rows.length)} 条记录`);}
function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,4000);}
document.addEventListener('click',event=>{const b=event.target.closest('button,a[data-nav]');if(!b||b.disabled)return;if(b.dataset.nav){event.preventDefault();nav(b.dataset.nav,{filter:b.dataset.viewFilter||'all',taskStatus:b.dataset.taskFilter||'all'});return;}if(b.dataset.actor){showActor(b.dataset.actor);return;}if(b.dataset.task){showTask(b.dataset.task);return;}if(b.dataset.actorTask){const a=actorsById.get(b.dataset.actorTask);$('detail').close();nav('tasks',{source:a.source_id,query:a.external_id});return;}if(b.dataset.sourceTasks){nav('tasks',{source:b.dataset.sourceTasks});return;}if(b.dataset.gap){nav('actors',{filter:b.dataset.gap==='avatar'?'missing-avatar':'field-'+b.dataset.gap});return;}if(b.dataset.filter){route({filter:b.dataset.filter,page:1});document.querySelector(`[data-filter="${b.dataset.filter}"]`)?.focus({preventScroll:true});return;}if(b.dataset.layout){route({layout:b.dataset.layout});document.querySelector(`[data-layout="${b.dataset.layout}"]`)?.focus({preventScroll:true});return;}if(b.dataset.taskStatus){route({taskStatus:b.dataset.taskStatus,page:1});document.querySelector(`[data-task-status="${b.dataset.taskStatus}"]`)?.focus({preventScroll:true});return;}if(b.dataset.page){route({page:Number(b.dataset.page)});$('main').scrollIntoView({block:'start'});$('main').focus({preventScroll:true});return;}if(b.dataset.action==='clear-task-query'){route({query:'',page:1});$('main').focus({preventScroll:true});return;}if(b.dataset.action==='clear-search'){route({query:'',filter:'all',source:'all',page:1});$('actor-search').focus();}if(b.dataset.action==='export-actors')download(actorRows(),'actors-filtered.json');if(b.dataset.action==='export-gaps')download(D.actors.filter(a=>a.missing_fields.length).map(a=>({source_id:a.source_id,external_id:a.external_id,name:a.name,missing_fields:a.missing_fields})),'actor-gaps.json');if(b.dataset.action==='export-tasks')download(taskRows(),'tasks-filtered.json');});
function updateSearch(input){state.query=input.value;state.page=1;const p=new URLSearchParams(location.hash.split('?')[1]||'');if(state.query)p.set('q',state.query);else p.delete('q');p.delete('page');history.replaceState(null,'','#actors'+(p.size?'?'+p:''));renderActors();}
document.addEventListener('compositionstart',event=>{if(event.target.id==='actor-search')composing=true;});document.addEventListener('compositionend',event=>{if(event.target.id==='actor-search'){composing=false;updateSearch(event.target);}});document.addEventListener('input',event=>{if(event.target.id==='actor-search'&&!composing)updateSearch(event.target);});document.addEventListener('change',event=>{if(event.target.id==='actor-sort'){route({sort:event.target.value,page:1});$('actor-sort').focus();}if(event.target.id==='task-source'){route({source:event.target.value,page:1});$('task-source').focus();}});$('close-detail').onclick=()=>$('detail').close();document.addEventListener('keydown',event=>{if(event.key==='/'&&!$('detail').open&&!/INPUT|SELECT|TEXTAREA/.test(event.target.tagName)){event.preventDefault();if(state.view!=='actors')nav('actors');$('actor-search').focus();}});history.scrollRestoration='manual';window.addEventListener('popstate',event=>{if($('detail').open)$('detail').close();readRoute();render();$('main').focus({preventScroll:true});requestAnimationFrame(()=>window.scrollTo(0,event.state?.scrollY||0));});window.addEventListener('hashchange',()=>{readRoute();render();$('main').focus({preventScroll:true});});readRoute();render();
</script>
</body>
</html>
